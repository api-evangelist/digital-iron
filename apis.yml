name: Digital Iron
description: Digital Iron is an AI platform delivering aftersales intelligence for heavy
  machinery. It helps equipment dealers and OEMs turn scattered service data — machine
  history, product documentation, customer records, bills of materials, work orders,
  and technician notes — into faster troubleshooting, accurate parts identification,
  and reliable job quoting. The platform surfaces recurring failure patterns across
  fleets (excavators, crushers, compaction rollers, and similar equipment) to improve
  first-time fix rates. Digital Iron is backed by Seedcamp and tracked in the API Evangelist
  network as a portfolio company; the product is delivered as a hosted web application
  and no public API has been identified to date.
